<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800&family=Lato:wght@400;700;900&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; }
  body {
    width: 1600px; height: 1000px; overflow: hidden;
    background:
      radial-gradient(ellipse 900px 520px at 50% 18%, rgba(196, 140, 40, 0.30), transparent 70%),
      radial-gradient(ellipse 1400px 700px at 50% 75%, rgba(120, 70, 20, 0.22), transparent 70%),
      linear-gradient(#17110a, #0b0906 70%);
    font-family: "Lato", sans-serif;
    position: relative;
  }
  .rays {
    position: absolute; inset: 0;
    background: repeating-conic-gradient(from 0deg at 50% -10%, rgba(255, 200, 100, 0.035) 0deg 3deg, transparent 3deg 9deg);
    -webkit-mask-image: radial-gradient(ellipse 800px 600px at 50% 0%, black, transparent 75%);
  }
  .head { position: absolute; top: 52px; left: 0; right: 0; text-align: center; }
  .pill {
    display: inline-block; padding: 9px 26px; border-radius: 999px;
    border: 1.5px solid #c9a24a; background: linear-gradient(#3a2a10, #20170a);
    color: #f2d27a; font-weight: 900; letter-spacing: 4px; font-size: 17px;
    box-shadow: 0 0 24px rgba(230, 170, 60, 0.35);
  }
  h1 {
    margin: 20px 0 0; font-family: "Cinzel", serif; font-weight: 800; font-size: 118px; line-height: 1.05;
    background: linear-gradient(#fff4c8 0%, #f6d27a 38%, #c8902e 72%, #8a5a18 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 4px 0 rgba(0, 0, 0, 0.6)) drop-shadow(0 0 30px rgba(240, 180, 70, 0.35));
  }
  .sub { margin-top: 14px; color: #e8e2d4; font-size: 27px; }
  .stage {
    position: absolute; left: 0; right: 0; top: 335px; height: 665px;
    perspective: 1700px; perspective-origin: 50% 30%;
  }
  .shot {
    position: absolute; top: 0; border-radius: 10px;
    box-shadow: 0 30px 60px rgba(0, 0, 0, 0.75), 0 0 0 1.5px rgba(201, 162, 74, 0.55);
  }
  .shot img { display: block; width: 100%; border-radius: 10px; }
  .side img { filter: brightness(0.72) saturate(0.9); }
  .left  { width: 550px; left: 100px;  top: 20px; transform: rotateY(30deg) translateZ(-120px); transform-origin: right center; }
  .right { width: 410px; right: 105px; top: 30px; transform: rotateY(-30deg) translateZ(-120px); transform-origin: left center; }
  .center {
    width: 790px; left: 405px; top: 30px; z-index: 2;
    box-shadow: 0 40px 80px rgba(0, 0, 0, 0.85), 0 0 0 2px #c9a24a, 0 0 50px rgba(230, 170, 60, 0.35);
  }
  .side { z-index: 0; }
  .fade {
    position: absolute; left: 0; right: 0; bottom: 0; height: 330px; z-index: 1;
    background: linear-gradient(transparent, #0b0906 85%);
  }
</style>
</head>
<body>
  <div class="rays"></div>
  <div class="head">
    <div class="pill">AUTOMATIC GROUPS</div>
    <h1>Forever Groups</h1>
    <div class="sub">Dungeons, quests and battlegrounds. Pick your role, click Find group, and your group forms itself.</div>
  </div>
  <div class="stage">
    <div class="shot side left"><img src="who.png"></div>
    <div class="shot side right"><img src="found.png"></div>
    <div class="fade"></div>
    <div class="shot center"><img src="main.png"></div>
  </div>
</body>
</html>
